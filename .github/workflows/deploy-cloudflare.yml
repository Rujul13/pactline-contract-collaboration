name: Deploy Pactline to Cloudflare

on:
  push:
    branches: [main, codex/phase-one-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pactline-production
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_D1_DATABASE_NAME: pactline-contracts
  CLOUDFLARE_R2_BUCKET_NAME: pactline-documents

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate application
        run: |
          npm run lint
          npm test

      - name: Ensure the free D1 database exists
        shell: bash
        run: |
          npx wrangler d1 create "$CLOUDFLARE_D1_DATABASE_NAME" >/dev/null 2>&1 || true
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1.json"
          DATABASE_ID=$(node --input-type=module -e '
            import fs from "node:fs";
            const databases = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const database = databases.find((entry) => entry.name === process.env.CLOUDFLARE_D1_DATABASE_NAME);
            if (!database) throw new Error(`D1 database ${process.env.CLOUDFLARE_D1_DATABASE_NAME} was not created`);
            process.stdout.write(database.uuid);
          ' "$RUNNER_TEMP/d1.json")
          echo "CLOUDFLARE_D1_DATABASE_ID=$DATABASE_ID" >> "$GITHUB_ENV"

      - name: Ensure the private R2 document bucket exists
        run: npx wrangler r2 bucket create "$CLOUDFLARE_R2_BUCKET_NAME" >/dev/null 2>&1 || true

      - name: Build production Worker
        run: npm run build

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config dist/server/wrangler.json

      - name: Publish application
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Protect the owner workspace
        env:
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        shell: bash
        run: |
          if [ ${#OWNER_PASSWORD} -lt 12 ]; then
            echo "OWNER_PASSWORD must be at least 12 characters" >&2
            exit 1
          fi
          node --input-type=module -e '
            import { pbkdf2Sync, randomBytes } from "node:crypto";
            const salt = randomBytes(16);
            const value = pbkdf2Sync(process.env.OWNER_PASSWORD, salt, 210000, 32, "sha256");
            process.stdout.write(`pbkdf2-sha256$210000$${salt.toString("base64url")}$${value.toString("base64url")}`);
          ' | npx wrangler secret put OWNER_PASSWORD_HASH --config dist/server/wrangler.json
          node --input-type=module -e 'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(48).toString("base64url"));' | npx wrangler secret put OWNER_SESSION_SECRET --config dist/server/wrangler.json
