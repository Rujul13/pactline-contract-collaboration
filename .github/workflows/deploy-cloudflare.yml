name: Deploy Pactline to Cloudflare

on:
  push:
    branches: [main, codex/phase-one-demo, codex/version-two-expansion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pactline-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Select isolated deployment environment
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "PACTLINE_ENVIRONMENT=production" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_D1_DATABASE_NAME=pactline-contracts" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_R2_BUCKET_NAME=pactline-documents" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_WORKER_NAME=pactline-contract-collaboration" >> "$GITHUB_ENV"
            echo "PACTLINE_VECTORIZE_INDEX_NAME=pactline-knowledge" >> "$GITHUB_ENV"
          else
            echo "PACTLINE_ENVIRONMENT=staging" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_D1_DATABASE_NAME=pactline-contracts-staging" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_R2_BUCKET_NAME=pactline-documents-staging" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_WORKER_NAME=pactline-contract-collaboration-staging" >> "$GITHUB_ENV"
            echo "PACTLINE_VECTORIZE_INDEX_NAME=pactline-knowledge-staging" >> "$GITHUB_ENV"
          fi
          echo "PACTLINE_ENABLE_AI_BINDINGS=true" >> "$GITHUB_ENV"
          echo "PACTLINE_ENABLE_SCHEDULED_ALERTS=true" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate application
        run: |
          npm run lint
          npm test

      - name: Ensure the free D1 database exists
        shell: bash
        run: |
          npx wrangler d1 create "$CLOUDFLARE_D1_DATABASE_NAME" >/dev/null 2>&1 || true
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1.json"
          DATABASE_ID=$(node --input-type=module -e '
            import fs from "node:fs";
            const databases = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const database = databases.find((entry) => entry.name === process.env.CLOUDFLARE_D1_DATABASE_NAME);
            if (!database) throw new Error(`D1 database ${process.env.CLOUDFLARE_D1_DATABASE_NAME} was not created`);
            process.stdout.write(database.uuid);
          ' "$RUNNER_TEMP/d1.json")
          echo "CLOUDFLARE_D1_DATABASE_ID=$DATABASE_ID" >> "$GITHUB_ENV"

      - name: Ensure the private R2 document bucket exists
        run: npx wrangler r2 bucket create "$CLOUDFLARE_R2_BUCKET_NAME" >/dev/null 2>&1 || true

      - name: Ensure the semantic-search index exists
        shell: bash
        run: |
          if npx wrangler vectorize get "$PACTLINE_VECTORIZE_INDEX_NAME" >/dev/null 2>&1 || \
             npx wrangler vectorize create "$PACTLINE_VECTORIZE_INDEX_NAME" --dimensions=384 --metric=cosine; then
            echo "CLOUDFLARE_VECTORIZE_INDEX_NAME=$PACTLINE_VECTORIZE_INDEX_NAME" >> "$GITHUB_ENV"
          else
            echo "::warning::Vectorize is unavailable to this API token; deploying the authorized D1 keyword-search fallback."
            echo "CLOUDFLARE_VECTORIZE_INDEX_NAME=" >> "$GITHUB_ENV"
          fi

      - name: Build production Worker
        run: npm run build

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config dist/server/wrangler.json

      - name: Ensure a workers.dev address exists
        shell: bash
        run: |
          STATUS=$(curl --silent --output "$RUNNER_TEMP/workers-subdomain.json" --write-out "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          CURRENT_SUBDOMAIN=$(node --input-type=module -e '
            import fs from "node:fs";
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            process.stdout.write(response.result?.subdomain || "");
          ' "$RUNNER_TEMP/workers-subdomain.json")
          if [ "$STATUS" = "200" ] && [ -n "$CURRENT_SUBDOMAIN" ]; then
            echo "Using existing workers.dev account subdomain: $CURRENT_SUBDOMAIN"
          else
            curl --fail-with-body --silent --show-error \
              --request PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"subdomain":"pactline-rujul13"}'
          fi
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$RUNNER_TEMP/workers-subdomain-final.json"
          FINAL_SUBDOMAIN=$(node --input-type=module -e '
            import fs from "node:fs";
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!response.result?.subdomain) throw new Error("workers.dev subdomain is unavailable");
            process.stdout.write(response.result.subdomain);
          ' "$RUNNER_TEMP/workers-subdomain-final.json")
          echo "CLOUDFLARE_WORKERS_SUBDOMAIN=$FINAL_SUBDOMAIN" >> "$GITHUB_ENV"

      - name: Configure owner authentication
        env:
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        shell: bash
        run: |
          if [ ${#OWNER_PASSWORD} -lt 12 ]; then
            echo "OWNER_PASSWORD must be at least 12 characters" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
            import fs from "node:fs";
            import { pbkdf2Sync, randomBytes } from "node:crypto";
            const salt = randomBytes(16);
            const value = pbkdf2Sync(process.env.OWNER_PASSWORD, salt, 100000, 32, "sha256");
            const passwordHash = `pbkdf2-sha256$100000$${salt.toString("base64url")}$${value.toString("base64url")}`;
            const sessionSecret = randomBytes(48).toString("base64url");
            const quote = (input) => input.replaceAll("'", "''");
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/owner-settings.sql`, `
              INSERT INTO app_settings (key, value, updated_at) VALUES ('owner_password_hash', '${quote(passwordHash)}', CURRENT_TIMESTAMP)
              ON CONFLICT(key) DO UPDATE SET value = excluded.value, updated_at = CURRENT_TIMESTAMP;
              DELETE FROM app_settings WHERE key = 'owner_password_sha256';
              INSERT INTO app_settings (key, value, updated_at) VALUES ('owner_session_secret', '${quote(sessionSecret)}', CURRENT_TIMESTAMP)
              ON CONFLICT(key) DO NOTHING;
            `);
          NODE
          npx wrangler d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" --remote --config dist/server/wrangler.json --file "$RUNNER_TEMP/owner-settings.sql"

      - name: Publish application
        run: npx wrangler deploy --name "$CLOUDFLARE_WORKER_NAME" --config dist/server/wrangler.json

      - name: Configure the Groq API secret
        if: ${{ env.GROQ_API_KEY != '' }}
        shell: bash
        run: printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY --name "$CLOUDFLARE_WORKER_NAME" --config dist/server/wrangler.json

      - name: Verify live owner authentication
        env:
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        shell: bash
        run: |
          BASE_URL="https://$CLOUDFLARE_WORKER_NAME.$CLOUDFLARE_WORKERS_SUBDOMAIN.workers.dev"
          LOGIN_BODY=$(node --input-type=module -e 'process.stdout.write(JSON.stringify({ password: process.env.OWNER_PASSWORD, returnTo: "/" }));')
          LOGIN_OK=false
          for ATTEMPT in {1..10}; do
            if curl --fail --silent --show-error \
              --cookie-jar "$RUNNER_TEMP/owner-cookies.txt" \
              --header "Content-Type: application/json" \
              --data "$LOGIN_BODY" \
              "$BASE_URL/api/owner/login" >/dev/null; then
              LOGIN_OK=true
              break
            fi
            sleep 2
          done
          if [ "$LOGIN_OK" != "true" ]; then
            echo "The staging Worker did not become ready for owner login" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --cookie "$RUNNER_TEMP/owner-cookies.txt" \
            "$BASE_URL/api/workspace" \
            --output "$RUNNER_TEMP/workspace.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const workspace = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!workspace.contracts?.some((contract) => contract.id === "sample-services-agreement")) {
              throw new Error("Authenticated workspace did not seed the demo contract");
            }
          ' "$RUNNER_TEMP/workspace.json"

          curl --fail-with-body --silent --show-error \
            --cookie "$RUNNER_TEMP/owner-cookies.txt" \
            "$BASE_URL/api/v2/workspace" \
            --output "$RUNNER_TEMP/version-two-workspace.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const workspace = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!workspace.suppliers?.length || !workspace.documents?.some((item) => item.content_type === "application/pdf") || !workspace.templates?.length || !workspace.alerts?.length) {
              throw new Error("Version two portfolio was not seeded completely");
            }
          ' "$RUNNER_TEMP/version-two-workspace.json"
          curl --fail-with-body --silent --show-error \
            --cookie-jar "$RUNNER_TEMP/portal-cookies.txt" \
            --header "Content-Type: application/json" \
            --data '{"username":"supplier.reviewer","password":"SupplierDemo!2026"}' \
            "$BASE_URL/api/portal/login" >/dev/null
          curl --fail-with-body --silent --show-error \
            --cookie "$RUNNER_TEMP/portal-cookies.txt" \
            "$BASE_URL/api/portal/workspace" \
            --output "$RUNNER_TEMP/portal-workspace.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const workspace = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!workspace.contracts?.some((item) => item.status === "locked") || !workspace.documents?.length) {
              throw new Error("Supplier portal did not expose its scoped portfolio");
            }
          ' "$RUNNER_TEMP/portal-workspace.json"

          # Exercise the complete synthetic reviewer round, then restore the demo.
          curl --fail-with-body --silent --show-error --request POST \
            --cookie "$RUNNER_TEMP/owner-cookies.txt" \
            "$BASE_URL/api/demo/reset" >/dev/null
          curl --fail-with-body --silent --show-error \
            --cookie-jar "$RUNNER_TEMP/reviewer-cookies.txt" \
            --header "Content-Type: application/json" \
            --data '{"username":"client.reviewer","password":"ReviewDemo!2026"}' \
            "$BASE_URL/api/client/login" >/dev/null
          curl --fail-with-body --silent --show-error \
            --cookie "$RUNNER_TEMP/reviewer-cookies.txt" \
            "$BASE_URL/api/client/contracts/sample-services-agreement/proposals" \
            --output "$RUNNER_TEMP/reviewer-workspace.json"
          node --input-type=module <<'NODE'
            import fs from "node:fs";
            const workspace = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/reviewer-workspace.json`, "utf8"));
            const blocks = workspace.blocks.filter((item) => item.kind === "body" && item.current_text.length > 40).slice(0, 2);
            if (blocks.length !== 2) throw new Error("Reviewer smoke test could not find two editable paragraphs");
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/proposal-body.json`, JSON.stringify({
              baseVersion: workspace.contract.current_version,
              edits: blocks.map((block, index) => ({ blockId: block.id, originalText: block.current_text, proposedText: `${block.current_text} Deployment verification ${index + 1}.` })),
            }));
          NODE
          curl --fail-with-body --silent --show-error \
            --cookie "$RUNNER_TEMP/reviewer-cookies.txt" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/proposal-body.json" \
            "$BASE_URL/api/client/contracts/sample-services-agreement/proposals" \
            --output "$RUNNER_TEMP/proposal-result.json"
          PROPOSAL_IDS=$(node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (result.proposals?.length !== 2) throw new Error("Reviewer proposal smoke test failed");
            process.stdout.write(result.proposals.map((proposal) => proposal.id).join(" "));
          ' "$RUNNER_TEMP/proposal-result.json")
          read -r PROPOSAL_ID_1 PROPOSAL_ID_2 <<< "$PROPOSAL_IDS"

          # A reviewer cookie must never authorize owner-only APIs, even when called directly.
          assert_reviewer_forbidden() {
            local METHOD="$1"
            local URL="$2"
            local BODY="${3:-}"
            local ARGS=(--silent --show-error --request "$METHOD" --cookie "$RUNNER_TEMP/reviewer-cookies.txt" --output "$RUNNER_TEMP/forbidden.json" --write-out "%{http_code}")
            if [ -n "$BODY" ]; then ARGS+=(--header "Content-Type: application/json" --data "$BODY"); fi
            STATUS=$(curl "${ARGS[@]}" "$URL")
            if [ "$STATUS" != "403" ]; then
              echo "Reviewer reached owner-only endpoint $URL (HTTP $STATUS)" >&2
              cat "$RUNNER_TEMP/forbidden.json" >&2
              exit 1
            fi
          }
          assert_reviewer_forbidden POST "$BASE_URL/api/contracts/sample-services-agreement/paragraph-proposals/$PROPOSAL_ID_1/resolve" '{"action":"accept"}'
          assert_reviewer_forbidden POST "$BASE_URL/api/contracts/sample-services-agreement/ai-suggestions/apply" '{"baseVersion":1,"operation":"replace_block","targetBlockId":"forged","replacementText":"forged"}'
          assert_reviewer_forbidden GET "$BASE_URL/api/contracts/sample-services-agreement/download"

          curl --fail-with-body --silent --show-error \
            --cookie "$RUNNER_TEMP/owner-cookies.txt" \
            --header "Content-Type: application/json" \
            --data '{"action":"accept"}' \
            "$BASE_URL/api/contracts/sample-services-agreement/paragraph-proposals/$PROPOSAL_ID_1/resolve" \
            --output "$RUNNER_TEMP/accept-result-1.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (result.status !== "accepted" || result.versionNumber !== 2) throw new Error("Owner acceptance smoke test failed");
          ' "$RUNNER_TEMP/accept-result-1.json"
          curl --fail-with-body --silent --show-error \
            --cookie "$RUNNER_TEMP/owner-cookies.txt" \
            --header "Content-Type: application/json" \
            --data '{"action":"accept"}' \
            "$BASE_URL/api/contracts/sample-services-agreement/paragraph-proposals/$PROPOSAL_ID_2/resolve" \
            --output "$RUNNER_TEMP/accept-result-2.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (result.status !== "accepted" || result.versionNumber !== 3) throw new Error("Rebased sibling proposal could not be accepted");
          ' "$RUNNER_TEMP/accept-result-2.json"
          curl --fail-with-body --silent --show-error --request POST \
            --cookie "$RUNNER_TEMP/owner-cookies.txt" \
            "$BASE_URL/api/demo/reset" >/dev/null

          curl --fail-with-body --silent --show-error \
            --cookie "$RUNNER_TEMP/portal-cookies.txt" \
            "$BASE_URL/api/portal/workspace" \
            --output "$RUNNER_TEMP/portal-workspace-after-reset.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const workspace = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!workspace.contracts?.some((item) => item.id === "sample-services-agreement") || !workspace.contracts?.some((item) => item.status === "locked")) {
              throw new Error("Demo reset did not restore both current and expired supplier contracts");
            }
          ' "$RUNNER_TEMP/portal-workspace-after-reset.json"

          if [ -n "$GROQ_API_KEY" ]; then
            AI_BODY='{"mode":"chat","message":"In one short sentence, identify the purpose of this contract.","history":[],"acknowledgedExternalProcessing":true}'
            curl --fail-with-body --silent --show-error \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --cookie "$RUNNER_TEMP/owner-cookies.txt" \
              --header "Content-Type: application/json" \
              --data "$AI_BODY" \
              "$BASE_URL/api/contracts/sample-services-agreement/ai-assistant" \
              --output "$RUNNER_TEMP/ai-check.json"
            node --input-type=module -e '
              import fs from "node:fs";
              const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!result.reply || result.operation !== "none") throw new Error("Live AI assistant verification failed");
            ' "$RUNNER_TEMP/ai-check.json"
          else
            echo "GROQ_API_KEY is not configured; deployed AI will remain unavailable until the repository secret is added."
          fi
